<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Player</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#6b7280;--bd:#e3e6ea;--ac:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mu:#98a0ad;--bd:#272b33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:auto;padding:16px}a{color:var(--ac)}h1{margin:8px 0 4px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;text-transform:capitalize}
.k{color:var(--mu);width:35%}.mm{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}.mm b{margin-left:auto}.mu{color:var(--mu);font-size:13px}
</style></head><body><main>
<a href="/">← Schedule</a> <span id="back"></span><h1 id="h"></h1><div id="body"></div>
<p class="mu">Data from <a href="https://liquipedia.net/valorant" target="_blank" rel="noopener">Liquipedia</a> (CC-BY-SA 3.0).</p></main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q=new URLSearchParams(location.search),id=q.get("id")||"",team=q.get("team");
document.getElementById("h").textContent=id;document.title=id;
if(team)document.getElementById("back").innerHTML='· <a href="team.html?name='+encodeURIComponent(team)+'">'+esc(team)+'</a>';
(async()=>{
  let h="";
  try{
    const r=await fetch("/api/player/"+encodeURIComponent(id));if(!r.ok)throw 0;const p=await r.json();
    const info=Object.entries(p.info||{});
    h+=info.length?'<div class="card"><table>'+info.map(([k,v])=>'<tr><td class="k">'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join("")+'</table></div>':'<div class="card mu">No details found.</div>';
    h+='<p><a href="'+esc(p.url)+'" target="_blank" rel="noopener">Liquipedia page ↗</a></p>';
  }catch(e){h='<div class="card mu">No Liquipedia data for this player.</div>';}
  document.getElementById("body").innerHTML=h;
})();
</script></body></html>
