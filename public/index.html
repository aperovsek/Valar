<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VALORANT Match Schedule</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="header">
        <div class="header-top">
            <h1>VALORANT <small>Match Schedule</small></h1>
            <div class="user-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme"></button>
                <button id="login-btn" class="user-btn">Login</button>
            </div>
        </div>
        <nav class="navbar">
            <a href="/" class="nav-tab active">Schedule</a>
            <a href="teams.html" class="nav-tab">Teams</a>
            <a href="events.html" class="nav-tab">Events</a>
        </nav>
    </header>
    <div class="wrap">
        <aside>
            <div class="panel">
                <h2>Events <a href="#" id="ce">clear</a></h2>
                <div class="list" id="le"></div>
            </div>
            <div class="panel">
                <h2>Teams <a href="#" id="ct">clear</a></h2>
                <div class="list" id="lt"></div>
            </div>
        </aside>
        <main>
            <div class="page-toolbar">
                <div class="tabs">
                    <button id="tu" class="on">Upcoming</button>
                    <button id="tr">Results</button>
                </div>
                <button class="btn btn-primary" id="rf">Refresh</button>
            </div>
            <div class="chips" id="chips"></div>
            <div id="out"><div class="empty">Loading...</div></div>
        </main>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
